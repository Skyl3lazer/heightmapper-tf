sources:
    elevation:
        type: Raster
        url: https://tiles.mapterhorn.com/{z}/{x}/{y}.webp
        # The highest zoom Mapterhorn has everywhere. Past it Tangram scales these tiles up instead of leaving holes.
        max_zoom: 12
        tile_size: 512
styles:
    hillshade:
        base: raster
        shaders:
            uniforms:
                u_max: 8900. # everest = 8848
                u_min: 0. # sea level
            blocks:
                global: |
                    float unpack(vec4 h) {
                        // The GPU reads each channel as 0-1. The tile encodes it as 0-255.
                        return (h.r * 256. + h.g + h.b / 256.) * 255. - 32768.;
                    }
                color: |
                    float height = unpack(color);

                    float new_value = (height - u_min)/(u_max - u_min);

                    color.rgb = vec3(new_value);
                    color.a = 1.0;

layers:
    terrain:
        data: { source: elevation, layer: _default }
        draw:
            hillshade:
                order: 0
